# ==============================================================================
# Manasvia Backend - Base Application Configuration (Shared Across All Profiles)
# ==============================================================================

spring:
  application:
    name: manasvia-backend

  # Active profile defaults to 'dev' for frictionless local onboarding
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 21+ Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # Common JPA / Hibernate settings
  jpa:
    open-in-view: false

  # Flyway Database Migration Core Settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Default Web Server Port
server:
  port: ${SERVER_PORT:8080}
