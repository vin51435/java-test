# ==============================================================================
# Manasvia Backend - Base Application Configuration (Shared Across All Profiles)
# ==============================================================================

spring:
  application:
    name: manasvia-backend

  # Active profile defaults to 'dev' for frictionless local onboarding
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 21+ Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # Common JPA / Hibernate settings
  jpa:
    open-in-view: false

  # Flyway Database Migration Core Settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ==============================================================================
# Security & JWT Configuration
# ==============================================================================
manasvia:
  jwt:
    # 256-bit HS256 secret key (64 hex characters)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Standard authenticated access token: 24 hours (86,400,000 ms)
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000}
    # Extended guest access token: 30 days (2,592,000,000 ms)
    guest-token-expiration-ms: ${JWT_GUEST_EXPIRATION:2592000000}

# ==============================================================================
# SpringDoc OpenAPI / Swagger UI Configuration
# ==============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

# Default Web Server Port
server:
  port: ${SERVER_PORT:8080}
