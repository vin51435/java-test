# ==============================================================================
# Test Profile (application-test.yml)
# Used during automated Gradle and JUnit test execution
# ==============================================================================

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:manasvia_dev}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
